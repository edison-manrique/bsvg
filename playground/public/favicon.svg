<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Geometric Robot / Vector Node glyph -->
  <g filter="url(#neonGlow)">
    <!-- Outer Hex Shield / Node outline -->
    <path d="M32 10 L48 19 L48 45 L32 54 L16 45 L16 19 Z" fill="none" stroke="url(#neonGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Energy Bolt / Binary Vector Core -->
    <path d="M34 16 L23 32 L31 32 L28 48 L41 30 L33 30 Z" fill="url(#boltGrad)"/>
    
    <!-- Neon Connection Dots -->
    <circle cx="32" cy="10" r="2.5" fill="#38bdf8"/>
    <circle cx="48" cy="19" r="2" fill="#818cf8"/>
    <circle cx="48" cy="45" r="2" fill="#c084fc"/>
    <circle cx="32" cy="54" r="2.5" fill="#38bdf8"/>
    <circle cx="16" cy="45" r="2" fill="#c084fc"/>
    <circle cx="16" cy="19" r="2" fill="#818cf8"/>
  </g>
</svg>
